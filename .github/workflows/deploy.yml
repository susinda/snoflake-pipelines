
name: Ingest Student CSV Data

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: GITHUB_CICD_USER
      SNOWFLAKE_ROLE: STUDENT_DEPLOY_ROLE
      SNOWFLAKE_WAREHOUSE: STUDENT_WH

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Create Snowflake stage
        run: snow sql -x -f sql/02_stage.sql

      - name: Upload enrolments CSV from GitHub
        run: |
          snow stage copy \
            data/enrolments.csv \
            @STUDENT.RAW.CSV_STAGE/enrolments/ \
            --no-auto-compress \
            --overwrite \
            -x

      - name: Upload payments CSV from GitHub
        run: |
          snow stage copy \
            data/student_payments.csv \
            @STUDENT.RAW.CSV_STAGE/payments/ \
            --no-auto-compress \
            --overwrite \
            -x
            
      - name: Load CSV data into Snowflake RAW tables
        run: snow sql -x -f sql/03_load.sql
